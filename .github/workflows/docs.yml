name: Public site CI and deployment

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "evidence/**"
      - "frontend/public/fonts/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "evidence/**"
      - "frontend/public/fonts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.15.1"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Type and content check
        working-directory: site
        run: pnpm check

      - name: Build static documentation
        working-directory: site
        env:
          SITE_URL: https://arena.ss-data.cc
          SITE_BASE: /
        run: pnpm build

      - name: Verify generated pages and links
        working-directory: site
        env:
          SITE_BASE: /
        run: pnpm verify:build

      - name: Save verified public site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: site/dist
          if-no-files-found: error

  deploy:
    name: Deploy public site to production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://arena.ss-data.cc
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download verified public site
        uses: actions/download-artifact@v4
        with:
          name: public-site
          path: dist

      - name: Deploy to existing Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.123.0 pages deploy dist
          --project-name=text-to-sql-arena
          --branch=main
          --commit-hash="$GITHUB_SHA"
