  title: 相关子查询分群均值
  category: subquery
  radar_dimension: 复杂查询
  difficulty: hard
  question: 找出金额高于同客户分群已完成订单平均金额的已完成订单，输出 order_id、customer_id、segment、total_amount、segment_avg_amount，并按
    total_amount 降序、order_id 升序；必须使用外层引用的相关子查询。
  reference_sql: SELECT o.order_id, o.customer_id, c.segment, o.total_amount, a.segment_avg_amount
    FROM fact_orders o JOIN dim_customers c ON c.customer_id = o.customer_id JOIN
    LATERAL (SELECT ROUND(AVG(o2.total_amount), 2) AS segment_avg_amount FROM fact_orders
    o2 JOIN dim_customers c2 ON c2.customer_id = o2.customer_id WHERE o2.status =
    'completed' AND c2.segment = c.segment) a ON TRUE WHERE o.status = 'completed'
    AND o.total_amount > a.segment_avg_amount ORDER BY o.total_amount DESC, o.order_id
    ASC
  required_ast:
  - id: correlated
    kind: correlated_subquery
    min: 1
  comparison:
    row_order_significant: true
