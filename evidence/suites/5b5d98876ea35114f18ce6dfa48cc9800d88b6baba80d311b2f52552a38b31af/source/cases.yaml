  title: 渠道核心指标
  category: semantic_metrics
  radar_dimension: 聚合与指标
  difficulty: hard
  question: 按 channel_type 输出 completed_order_count、net_revenue、paid_amount、refunded_amount、failed_amount。所有指标必须遵循语义层口径，避免订单行与支付记录直接连接造成重复计算，并按
    channel_type 升序。
  reference_sql: WITH sales AS (SELECT ch.channel_type, COUNT(DISTINCT o.order_id)
    AS completed_order_count, SUM(i.quantity * i.unit_price - i.discount_amount) AS
    net_revenue FROM dim_channels ch JOIN fact_orders o ON o.channel_id = ch.channel_id
