  title: 每品类收入前三商品
  category: window_rank
  radar_dimension: 时间与窗口
  difficulty: hard
  question: 按净销售额取每个品类恰好前三商品，同额时按 product_id 升序打破并列；输出 category、product_id、product_name、net_revenue、rank_no，并按
