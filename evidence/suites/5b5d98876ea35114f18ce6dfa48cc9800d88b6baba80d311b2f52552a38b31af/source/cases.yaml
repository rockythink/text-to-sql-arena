- stable_key: order_total_reconciliation
  title: 订单头明细金额对账
  category: data_quality
  radar_dimension: 数据开发
  difficulty: medium
  question: 对账订单头金额与订单行净额。输出存在差异的 order_id、stored_total、calculated_total、difference，其中
    calculated_total 为订单行 quantity * unit_price - discount_amount 之和，difference 为
    stored_total - calculated_total，均四舍五入 2 位；按绝对差异降序、order_id 升序。
  reference_sql: WITH item_totals AS (SELECT order_id, SUM(quantity * unit_price -
    discount_amount) AS calculated_total FROM fact_order_items GROUP BY order_id)
    SELECT o.order_id, o.total_amount AS stored_total, ROUND(COALESCE(i.calculated_total,
    0), 2) AS calculated_total, ROUND(o.total_amount - COALESCE(i.calculated_total,
    0), 2) AS difference FROM fact_orders o LEFT JOIN item_totals i ON i.order_id
    = o.order_id WHERE ABS(o.total_amount - COALESCE(i.calculated_total, 0)) > 0.005
    ORDER BY ABS(difference) DESC, o.order_id ASC
  required_ast:
  - id: reconciliation-cte
    kind: cte_count
    min: 1
  comparison:
    row_order_significant: true
