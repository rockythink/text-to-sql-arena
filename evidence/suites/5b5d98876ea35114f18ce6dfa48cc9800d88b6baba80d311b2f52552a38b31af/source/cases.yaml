- stable_key: category_return_rate
  title: 品类退货率
  category: multi_stage_cte
  radar_dimension: 数据开发
  difficulty: hard
  question: 先分别聚合已完成订单的售出数量和退货数量，再计算品类退货率；输出 category、sold_qty、returned_qty、return_rate，比率四舍五入
    4 位，按 return_rate 降序、category 升序；必须至少两个 CTE 且不得明细直接 JOIN 造成 fan-out。
  reference_sql: WITH sold AS (SELECT p.category, SUM(i.quantity) AS sold_qty FROM
    fact_order_items i JOIN fact_orders o ON o.order_id = i.order_id JOIN dim_products
    p ON p.product_id = i.product_id WHERE o.status = 'completed' GROUP BY p.category),
    returned AS (SELECT p.category, SUM(r.return_qty) AS returned_qty FROM fact_returns
    r JOIN fact_order_items i ON i.order_id = r.order_id AND i.line_no = r.line_no
    JOIN fact_orders o ON o.order_id = i.order_id JOIN dim_products p ON p.product_id
    = i.product_id WHERE o.status = 'completed' GROUP BY p.category) SELECT s.category,
    s.sold_qty, COALESCE(r.returned_qty, 0) AS returned_qty, ROUND(COALESCE(r.returned_qty,
    0)::DECIMAL / NULLIF(s.sold_qty, 0), 4) AS return_rate FROM sold s LEFT JOIN returned
    r ON r.category = s.category ORDER BY return_rate DESC, s.category ASC
  required_ast:
  - id: cte-2
    kind: cte_count
    min: 2
  - id: preaggregate
    kind: separate_measure_preaggregation
    left_cte: sold
    left_measure_table: fact_order_items
    left_measure_column: quantity
    right_cte: returned
    right_measure_table: fact_returns
    right_measure_column: return_qty
    group_keys:
    - category
  comparison:
    row_order_significant: true
    duplicate_policy: multiset
    decimal_scale: 4
    abs_tolerance: '0.00005'
    rel_tolerance: '0'
    max_rows: 10000
  weight: 1.0
  sort_order: 11
