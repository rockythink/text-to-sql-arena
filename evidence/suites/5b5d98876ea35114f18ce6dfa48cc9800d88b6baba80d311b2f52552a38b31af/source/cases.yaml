    GROUP BY ch.channel_type), payments AS (SELECT ch.channel_type, SUM(CASE WHEN
    p.status = 'paid' THEN p.amount ELSE 0 END) AS paid_amount, SUM(CASE WHEN p.status
    = 'refunded' THEN p.amount ELSE 0 END) AS refunded_amount, SUM(CASE WHEN p.status
    = 'failed' THEN p.amount ELSE 0 END) AS failed_amount FROM dim_channels ch JOIN
    fact_orders o ON o.channel_id = ch.channel_id JOIN fact_payments p ON p.order_id
    = o.order_id GROUP BY ch.channel_type) SELECT ch.channel_type, COALESCE(s.completed_order_count,
    0) AS completed_order_count, COALESCE(s.net_revenue, 0) AS net_revenue, COALESCE(p.paid_amount,
    0) AS paid_amount, COALESCE(p.refunded_amount, 0) AS refunded_amount, COALESCE(p.failed_amount,
    0) AS failed_amount FROM (SELECT DISTINCT channel_type FROM dim_channels) ch LEFT
    JOIN sales s ON s.channel_type = ch.channel_type LEFT JOIN payments p ON p.channel_type
    = ch.channel_type ORDER BY ch.channel_type ASC
