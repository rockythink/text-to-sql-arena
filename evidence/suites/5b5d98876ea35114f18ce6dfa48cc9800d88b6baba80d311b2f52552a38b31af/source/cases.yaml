    AS (SELECT month, monthly_revenue, LAG(monthly_revenue) OVER (ORDER BY month ASC)
    AS previous_revenue FROM monthly) SELECT month, monthly_revenue, ROUND((monthly_revenue
    - previous_revenue) / NULLIF(previous_revenue, 0) * 100, 2) AS mom_pct FROM lagged
    ORDER BY month ASC
